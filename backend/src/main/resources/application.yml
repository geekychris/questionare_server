# Deployed configuration (default profile). Required env: DB_PASSWORD, OIDC_ISSUER,
# OIDC_CLIENT_ID, OIDC_CLIENT_SECRET; the app refuses to start without them.
# Local development without MySQL or the provider: SPRING_PROFILES_ACTIVE=dev (see README).

spring:
  application:
    name: questionnaire
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:questionare}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:questionare}
    # No default on purpose: the password comes from the environment (k8s Secret / .env).
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: ${SHOW_SQL:false}

app:
  # Public base URL used in share links (e.g. https://survey.hitorro.com); empty = relative /r/<token>.
  public-url: ${APP_PUBLIC_URL:}
  # Comma-separated origins allowed to call /api with credentials (local SPA development only).
  cors-origins: ${APP_CORS_ORIGINS:}
  auth:
    dev-login: false
  oidc:
    issuer: ${OIDC_ISSUER:}
    backchannel-url: ${OIDC_BACKCHANNEL_URL:}
    client-id: ${OIDC_CLIENT_ID:questionnaire}
    client-secret: ${OIDC_CLIENT_SECRET:}

server:
  port: ${SERVER_PORT:8080}
  # The cloud-stack proxy sends X-Forwarded-Host (with any :port) and X-Forwarded-Proto=https.
  forward-headers-strategy: framework
  error:
    include-message: always
  servlet:
    session:
      cookie:
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

vaadin:
  launch-browser: false
