apiVersion: devportal.io/v1
kind: Asset
metadata:
  id: questionare-server
  name: questionare_server
  description: Questionnaire application — Spring Boot + Vaadin admin UI with OIDC sign-in, share-link respondents under /r/, MySQL.
  owner: geekychris
  tags:
    - infra
    - spring-boot
    - vaadin
    - react
    - questionnaire
spec:
  type: service
  language: java
  build:
    tool: maven
    commands:
      install: cd backend && ./mvnw -DskipTests install
      test: cd backend && ./mvnw test
      build: cd backend && ./mvnw -DskipTests package
      package: cd backend && ./mvnw -Pproduction -DskipTests package
      clean: cd backend && ./mvnw clean
  docker:
    enabled: true
    dockerfile: backend/Dockerfile
    context: backend
    image: questionare-server/backend:latest
    images:
      - tag: questionare-server/backend:latest
        dockerfile: backend/Dockerfile
        context: backend
  kubernetes:
    enabled: true
    manifestPath: k8s
    namespace: questionare-server
  runtime:
    ports:
      - name: backend-http
        protocol: tcp
        purpose: http
      - name: mysql
        protocol: tcp
        purpose: db
    env:
      - name: DB_HOST
        default: mysql
        description: Host for the MySQL database the backend connects to.
      - name: DB_PORT
        default: "3306"
        description: MySQL port (in-cluster service port, not the NodePort).
      - name: DB_NAME
        default: questionare
        description: MySQL schema name.
      - name: DB_USERNAME
        default: questionare
        description: MySQL user.
      - name: DB_PASSWORD
        description: MySQL password (required; from a Secret or .env, never in git).
      - name: OIDC_ISSUER
        description: OIDC provider issuer URL (required).
      - name: OIDC_CLIENT_SECRET
        description: OIDC client secret (required; from a Secret).
      - name: SERVER_PORT
        default: "8080"
        description: Backend Spring Boot listen port (in-pod). External NodePort allocated by devportal.
  docs:
    architecture: README.md
    build: README.md
    run: README.md
