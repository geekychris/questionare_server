# MySQL + the app (Vaadin admin UI, /api, respondent links under /r/).
# Credentials and OIDC settings come from .env (copy .env.example; .env is gitignored).
# Without an OIDC provider, use the dev profile instead (README, "Local development").
#
# Host port mappings allocated by devportal for asset 'questionare-server':
#   backend-http  -> 18007
#   mysql         -> 18009

services:
  mysql:
    image: mysql:8.4
    container_name: questionnaire-mysql
    ports:
      - "18009:3306"
    env_file: .env
    environment:
      MYSQL_DATABASE: questionare
      MYSQL_USER: questionare
    healthcheck:
      # mysqladmin ping succeeds once the server answers, no credentials needed.
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    container_name: questionnaire-backend
    ports:
      - "18007:8080"
    env_file: .env
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: questionare
      DB_USERNAME: questionare
    depends_on:
      mysql:
        condition: service_healthy
