# Needs the Secrets mysql-credentials (see 10-mysql.yaml) and questionnaire-oidc:
#   kubectl -n questionare-server create secret generic questionnaire-oidc --from-literal=client-secret=...
# and OIDC_ISSUER set to your provider. Lab deployments use cloud-stack's deploy/questionnaire instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: questionare-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: questionare-server/backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_DATABASE
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_PASSWORD
            - name: OIDC_ISSUER
              value: https://auth.example.com
            - name: OIDC_CLIENT_ID
              value: questionnaire
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: questionnaire-oidc
                  key: client-secret
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 120
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: questionare-server
spec:
  type: NodePort
  selector:
    app: backend
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30005
      protocol: TCP
