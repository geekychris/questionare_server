# The credentials are the Secret mysql-credentials, which is NOT in git. Create it once:
#   kubectl -n questionare-server create secret generic mysql-credentials \
#     --from-literal=MYSQL_DATABASE=questionare --from-literal=MYSQL_USER=questionare \
#     --from-literal=MYSQL_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=MYSQL_ROOT_PASSWORD="$(openssl rand -hex 24)"
# (cloud-stack's deploy/questionnaire does the equivalent for the lab deployment.)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: questionare-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.4
          ports:
            - containerPort: 3306
              name: mysql
          envFrom:
            - secretRef:
                name: mysql-credentials
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - MYSQL_PWD="$MYSQL_PASSWORD" mysqladmin ping -h 127.0.0.1 -u"$MYSQL_USER" --silent
            initialDelaySeconds: 10
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: questionare-server
spec:
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
      protocol: TCP
